name: research-scaffold-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run end-to-end smoke experiment
        run: PYTHONPATH=src python scripts/run_smoke.py
      - name: Check the bundled real-world ETT pipeline
        run: PYTHONPATH=src python scripts/run_ett_baselines.py --dataset ETTh1 --max-rows 600
      - name: Validate repository structure
        run: PYTHONPATH=src python scripts/validate_repository.py
